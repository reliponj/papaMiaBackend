name: Deploy (main)

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH — pull, publish, restart service
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            echo "Pulling latest code..."
            cd /var/www/papaMiaBackend
            git pull origin main

            echo "Publishing project..."
            dotnet publish papaMiaBackend.Api/papaMiaBackend.Api.csproj -c Release -o /var/www/papaMiaBackend/publish

            echo "Restarting service..."
            sudo systemctl restart papamia

            echo "Deployment finished"